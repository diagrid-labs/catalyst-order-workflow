version: 1
common:
  logLevel: error
  appLogDestination: "console"
  daprdLogDestination: "console"
  resourcesPaths: ["./resources"]
  env:
    GRPC_DEFAULT_SSL_ROOTS_FILE_PATH: /home/pablo/.onebox/tls/ca.crt
apps:
  - appID: inventory
    appPort: 3002
    appDirPath: ./services/inventory
    command: ["python3", "app.py"]
  - appID: order-processor
    appDirPath: ./services/order-processor
    command: ["python3", "app.py"]
  - appID: payments
    appPort: 3003
    appDirPath: ./services/payments
    command: ["python3", "app.py"]
  - appID: notifications
    appPort: 8080
    appDirPath: ./services/notifications
    command: ["npm", "run", "dev"]
  - appID: shipping
    appPort: 3004
    appDirPath: ./services/shipping
    command: ["python3", "app.py"]
  - appID: inventory-agent
    appPort: 3005
    appDirPath: ./services/inventory-agent
    command: ["python3", "app.py"]
