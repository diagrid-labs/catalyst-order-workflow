version: 1
common:
  logLevel: error
  appLogDestination: "console"
  daprdLogDestination: "console"
  resourcesPaths: ["./resources"]
  env:
    # Each app runs with its own directory as the working directory, so this
    # puts ../../shared on the import path for the modules both workflows use.
    PYTHONPATH: ../../shared
apps:
  - appID: inventory
    appPort: 3002
    appDirPath: ./services/inventory
    command: ["python3", "app.py"]
  - appID: order-processor
    appDirPath: ./services/order-processor
    command: ["python3", "app.py"]
  - appID: payments
    appPort: 3003
    appDirPath: ./services/payments
    command: ["python3", "app.py"]
  - appID: notifications
    appPort: 8080
    appDirPath: ./services/notifications
    command: ["npm", "run", "dev"]
  - appID: shipping
    appPort: 3004
    appDirPath: ./services/shipping
    command: ["python3", "app.py"]
  - appID: inventory-agent
    appPort: 3005
    appDirPath: ./services/inventory-agent
    command: ["python3", "app.py"]
